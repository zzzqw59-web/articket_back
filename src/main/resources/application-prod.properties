# Oracle RDS
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT
jwt.secret-key=${JWT_SECRET_KEY}

# Toss Payments
toss.secret-key=${TOSS_SECRET_KEY}

# Public Data API
openapi.service-key=${OPENAPI_SERVICE_KEY}

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB
com.spring.website.upload.path=${UPLOAD_PATH:/home/ubuntu/articket_upload}
# Application
spring.application.name=articket

# Oracle RDS
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Swagger
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logging
logging.level.org.springframework.security.web=INFO

# Public Data API
openapi.service-key=${OPENAPI_SERVICE_KEY}

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB
com.spring.website.upload.path=${UPLOAD_PATH:/home/ubuntu/articket_upload}

# SOLAPI
solapi.api-key=${SOLAPI_API_KEY}
solapi.api-secret=${SOLAPI_API_SECRET}
solapi.sender=${SOLAPI_SENDER}

# Google Tink
tink.name-keyset=${TINK_NAME_KEYSET}
tink.phone-keyset=${TINK_PHONE_KEYSET}

# JWT
jwt.secret-key=${JWT_SECRET_KEY}

# Toss Payments
toss.secret-key=${TOSS_SECRET_KEY}
